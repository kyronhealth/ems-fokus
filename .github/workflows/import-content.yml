# Copies content/bank.json into the database whenever it changes on main.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Import content
on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-content
      - run: node scripts/import-content.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
